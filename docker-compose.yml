services:
    laravel.test:
        build:
            context: './laravel/vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - './laravel:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-filament_shop}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './laravel/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-ppassword']
            retries: 3
            timeout: 5s

    nuxt:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - './web:/app'
            - 'nuxt_node_modules:/app/node_modules'
            - 'nuxt_nuxt:/app/.nuxt'
        ports:
            - '3000:3000'
        environment:
            NUXT_PUBLIC_API_BASE_URL: 'http://localhost:80/api'
            NUXT_PUBLIC_APP_URL: 'http://localhost:3000'
            NUXT_PUBLIC_DEFAULT_LANGUAGE: 'en'
            NUXT_PUBLIC_DEFAULT_CURRENCY: 'USD'
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - sail
        depends_on:
            - laravel.test

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    nuxt_node_modules:
        driver: local
    nuxt_nuxt:
        driver: local
